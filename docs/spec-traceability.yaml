# Spec traceability -- pcsc-fido
#
# Single authoritative manifest: normative (and explicitly tagged IMPL-POLICY)
# literals mapped to source symbols. Enforced by the org lint-kit
# `spec_traceability` job (`make lint`).
#
# Fields per entry:
#   spec_prefix -- bare tag (no brackets). Source cites it as [TAG], e.g.
#                 YAML `CTAP2.3` <-> comment `[CTAP2.3]` (same convention as
#                 nero-nfc-reader-firmware).
#   symbol      -- #define / enum / const name
#   spec_value  -- normative numeric literal (decimal or 0x hex)
#   ref         -- clause / table in the cited document
#   source      -- repo-relative file containing the symbol
#
# Primary CTAP reference: FIDO CTAP 2.3 Proposed Standard (2026-02-26), same as nero-nfc.

