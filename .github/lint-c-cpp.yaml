# Consumer lint manifest for the org kit (pcsc-fido -- userspace-only daemon).

compile_db:
  firmware: null
  userspace:
    - cmake_args:
        - -DBUILD_TESTING=ON
        - -DCMAKE_BUILD_TYPE=Debug
        - -DPCSC_FIDO_DEBUG_SANITIZERS=OFF
      compile_commands_json: build/lint/userspace/compile_commands.json
      source: .

enabled_lint_jobs:
  - banned_cxx_heap
  - banned_libc_io
  - clang_tidy
  - compile_db
  - cppcheck
  - duplicate_includes
  - format
  - guard_clause_style
  - license
  - magic_literals
  - markdownlint
  - nolint_audit
  - null_nodiscard
  - openssf
  - pointer_bounds
  - raii_lifetime
  - relative_includes
  - shared_constant_dupes
  - spec_traceability
  - yamllint

firmware_build: null

license_header: |
  # SPDX-License-Identifier: Apache-2.0
  #
  # Copyright (C) 2026 Nero Duality, LLC.
  #
  # Licensed under the Apache License, Version 2.0 (the "License");
  # you may not use this file except in compliance with the License.
  # You may obtain a copy of the License at
  #
  #     http://www.apache.org/licenses/LICENSE-2.0
  #
  # Unless required by applicable law or agreed to in writing, software
  # distributed under the License is distributed on an "AS IS" BASIS,
  # WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
  # See the License for the specific language governing permissions and
  # limitations under the License.

policy:
  constants_headers:
    - daemon_config.h
    - daemon_rate_limit.h
    - pcsc_bridge_limits.h
  nolint_allowed: null
  overrides:
    clang-format:
      add: null
      by_compile_db: null
      remove: null
    clang-tidy-c:
      add: null
      by_compile_db: null
      remove: null
    clang-tidy-cxx:
      add: null
      by_compile_db: null
      remove: null
    clang-tidy-shared-c-cxx:
      add: null
      by_compile_db: null
      remove: null
    clang-tidy-unsafe-c:
      add: null
      by_compile_db: null
      remove: null
    clang-tidy-unsafe-cxx:
      add: null
      by_compile_db: null
      remove: null
    cppcheck:
      add: null
      by_compile_db: null
      remove: null
    openssf-hardening:
      add: null
      by_compile_db: null
      remove: null
  resource_lifetime: null
  shared_c_cxx_source_roots: null
  unsafe_api:
    header: pcsc_fido_null.h
    include_headers:
      - attrs.h
      - mem_util.h
      - pcsc_fido_parse.h
    wrapper_files:
      - src/mem_util.c
      - src/pcsc_err.c
      - src/pcsc_fido_io.c

scan:
  c_api_prefix: pcsc_fido
  c_macro_prefix: PCSC_FIDO
  exclude_gitignore: true
  public_headers_dir: include/pcsc_fido
  source_roots:
    - include
    - src
    - tests

spec_traceability:
  manifest: docs/spec-traceability.yaml

toolchain:
  lint_kit:
    path: lint-c-cpp
    ref: v0.3.0
    repository: neroduality/.github
  script: null

workflow:
  bare_vm_waivers:
    - job: publish
      workflow: release.yml
    - job: sbom-grype
      workflow: supply-chain-sbom.yml
    - job: audit
      workflow: zizmor_actionlint.yml

yamllint:
  default:
    schema: yaml
  files:
    - path: .github/lint-c-cpp.yaml
      schema: lint_config
      sort_by: key
    - path: docs/spec-traceability.yaml
      required_fields:
        - ref
        - source
        - spec_prefix
        - spec_value
        - symbol
      schema: spec_traceability
      sort_by:
        - spec_prefix
        - symbol
