# Lima template: Ubuntu 24.04 VM for pcsc-fido local CI (mirrors GitHub ubuntu-24.04).
# Used by: bash .github/scripts/run-ci-locally-lima.sh (via make lima).
minimumLimaVersion: 2.0.0

user:
  name: lima

base:
  - template:ubuntu-24.04

containerd:
  system: false
  user: false

param:
  repoRoot: ""
  lintKitRoot: ""

mounts:
  - location: "{{.Param.repoRoot}}"
    mountPoint: /src
    writable: false
  - location: "{{.Param.lintKitRoot}}"
    mountPoint: /opt/lint-kit
    writable: false

cpus: 4
memory: 8GiB
disk: 32GiB

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y --no-install-recommends ca-certificates curl gnupg software-properties-common
      add-apt-repository -y universe
      apt-get update

  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      export DEBIAN_FRONTEND=noninteractive
      if command -v docker >/dev/null 2>&1; then
        echo "-- Lima provision: docker CLI already installed --"
        exit 0
      fi
      install -d -m 0755 /var/lib/pcsc-fido-ci
      apt-get update
      apt-get install -y --no-install-recommends curl ca-certificates
      curl -fsSL https://get.docker.com -o /var/lib/pcsc-fido-ci/get-docker.sh
      sh /var/lib/pcsc-fido-ci/get-docker.sh > /var/lib/pcsc-fido-ci/docker-install.log 2>&1
      tail -n 3 /var/lib/pcsc-fido-ci/docker-install.log || true

  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      install -d -m 0755 /etc/systemd/system/docker.socket.d
      printf '%s\n' '[Socket]' 'SocketUser={{.User}}' \
        >/etc/systemd/system/docker.socket.d/override.conf
      chmod 0644 /etc/systemd/system/docker.socket.d/override.conf

  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      systemctl daemon-reload
      systemctl restart docker.socket docker.service
      systemctl is-active --quiet docker.service
      echo "-- Lima provision: Docker ready for user {{.User}} (SocketUser, no reboot) --"

probes:
  - script: |
      #!/bin/bash
      set -eux -o pipefail
      if ! timeout 30s bash -c 'until command -v docker >/dev/null 2>&1; do sleep 3; done'; then
        echo >&2 "docker CLI not installed yet"
        exit 1
      fi
      if ! timeout 30s bash -c 'until pgrep dockerd >/dev/null; do sleep 3; done'; then
        echo >&2 "dockerd is not running yet"
        exit 1
      fi
    hint: See "/var/log/cloud-init-output.log" and "journalctl -u docker.service" in the guest.

hostResolver:
  hosts:
    host.docker.internal: host.lima.internal

message: |
  pcsc-fido local CI Lima VM (ubuntu-24.04).
  Repo mount: /src (read-only source).
  CI work tree: ~/pcsc-fido-ci-work on guest disk.
  Boot: Docker (SocketUser) -> seed work tree -> CI via run-ci-locally-lima-guest.sh.
  Each `make lima` / `make ci-local CI_LOCAL_FLAGS=--lima` destroys and recreates this instance.
