# Code scanning -- C via CMake build of pcsc-fido.
# Container image + CLI bundle pins live in .github/scripts/helper-codeql-pins.sh
# (tag@digest). Keep `container.image` and `tools:` below in lockstep with that
# file; local reproduction (`make codeql-local`) sources the helper.
# Runs on manual dispatch only.
# Download SARIF: workflow run -> Artifacts -> codeql-cpp-sarif
name: CodeQL

on:
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded pull-request runs; never cancel a default-branch scan.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  analyze:
    name: Analyze (cpp)
    runs-on: ubuntu-24.04
    container:
      # Keep in lockstep with CODEQL_IMAGE_DEFAULT in helper-codeql-pins.sh.
      image: docker.io/library/debian:sid-slim@sha256:5ac67a4d7c0de96e83873e4dd8f7ea3b507ba292fb2cce60a0c3f73322df5cae
      options: --platform linux/amd64
    timeout-minutes: 360
    permissions:
      contents: read
      security-events: write
      # Required when CodeQL init/analyze run inside a job container (GitHub docs).
      actions: read

    env:
      # Manual traced C++ builds are incompatible with overlay-base caching on
      # default-branch runs; disable overlay up front to avoid analyze warnings.
      CODEQL_OVERLAY_DATABASE_MODE: none

    steps:
      # Inline: repo scripts are not available until after checkout.
      - name: Install checkout prerequisites
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y --no-install-recommends ca-certificates git tar
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y --setopt=install_weak_deps=False ca-certificates git tar
            dnf clean all
          else
            printf 'error: unsupported base image (need apt-get or dnf)\n' >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bootstrap container (CA certs, git)
        run: bash .github/scripts/ci-bootstrap-container.sh

      - name: Install build dependencies
        env:
          AUTO_INSTALL_LINUX_DEPS: "1"
          INSTALL_DEPS: "1"
          PCSC_FIDO_DEPS_SCOPE: "build"
        run: bash .github/scripts/install-linux-deps.sh

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: cpp
          build-mode: manual
          config-file: .github/codeql/codeql-config.yml
          # Bundle URL required (bare "2.27.3" is treated as a local path).
          # CODEQL_BUNDLE_URL_DEFAULT in helper-codeql-pins.sh; CLI zip is
          # codeql-linux64.zip v2.27.3 / SHA256 CODEQL_CLI_SHA256_DEFAULT.
          tools: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.3/codeql-bundle-linux64.tar.zst

      - name: CodeQL traced build (CMake)
        run: bash .github/scripts/ci-codeql-build.sh

      - name: Perform CodeQL analysis
        id: analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:cpp"
          output: codeql-results

      - name: Upload CodeQL SARIF artifact
        if: always() && steps.analyze.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-cpp-sarif
          path: codeql-results/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
