# OSV.dev dependency vulnerability scans (lockfiles / manifests).
# Manual only (workflow_dispatch). Local: .github/scripts/run-local-osv-scanner.sh
# Reusable workflow: https://google.github.io/osv-scanner/github-action/
name: OSV-Scanner

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osv-scanner-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
