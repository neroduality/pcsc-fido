# OpenSSF Scorecard analysis -- uploads SARIF to GitHub code scanning when enabled.
# Runs on schedule only (plus workflow_dispatch). Must stay aligned with upstream
# restrictions when publish_results is true:
# https://github.com/ossf/scorecard-action/blob/main/README.md
#
# Local reproduction: .github/scripts/run-local-openssf.sh
name: OpenSSF Scorecard

on:
  schedule:
    # Monthly -- 1st of month 01:30 UTC.
    - cron: "30 1 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: results.sarif
