# SBOM generation (Syft), NTIA minimum-elements check, then Grype; SARIF -> Code Scanning.
# Manual only (workflow_dispatch). Local: .github/scripts/run-local-supply-chain.sh
name: Supply chain (Syft, NTIA, Grype)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-sbom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  sbom-grype:
    name: SBOM + Grype
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate SBOM (Syft / SPDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          config: .syft.yaml
          syft-version: v1.55.0
          upload-release-assets: false
          dependency-snapshot: false
          # Uploaded below, after the NTIA step has named the root package.
          upload-artifact: false

      - name: NTIA minimum elements
        run: |
          python3 -m venv "${RUNNER_TEMP}/ntia"
          "${RUNNER_TEMP}/ntia/bin/pip" install --require-hashes \
            -r .github/pinned/ntia/requirements.txt
          export PATH="${RUNNER_TEMP}/ntia/bin:${PATH}"
          bash .github/scripts/verify-sbom-ntia.sh sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pcsc-fido-sbom-grype.spdx.json
          path: sbom.spdx.json
          if-no-files-found: error

      - name: Vulnerability scan (Grype on SBOM)
        id: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom.spdx.json
          grype-version: v0.121.0
          fail-build: false
          severity-cutoff: high
          output-format: sarif

      # Grype SBOM SARIF often omits physicalLocation.artifactLocation.uri (packages
      # have no on-disk path). GitHub Code Scanning rejects that with
      # locationFromSarifResult: expected artifact location (anchore/grype#2235).
      - name: Patch Grype SARIF artifact locations
        if: success() || failure()
        env:
          SARIF_PATH: ${{ steps.grype.outputs.sarif }}
        run: |
          set -euo pipefail
          if [[ -z ${SARIF_PATH} || ! -f ${SARIF_PATH} ]]; then
            printf 'warning: no Grype SARIF to patch\n' >&2
            exit 0
          fi
          jq --arg uri sbom.spdx.json '
            .runs[]?.results[]?.locations |=
              (map(. + {
                physicalLocation: ((.physicalLocation // {}) + {
                  artifactLocation: ((.physicalLocation.artifactLocation // {}) + {
                    uri: (if ((.physicalLocation.artifactLocation.uri // "") == "")
                          then $uri
                          else .physicalLocation.artifactLocation.uri end)
                  })
                })
              }))
          ' "${SARIF_PATH}" >"${SARIF_PATH}.patched"
          mv "${SARIF_PATH}.patched" "${SARIF_PATH}"

      - name: Upload Grype SARIF to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: success() || failure()
        continue-on-error: true
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype-sbom
